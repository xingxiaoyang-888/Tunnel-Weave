[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnelweave"
version = "0.1.0"
description = "Semantic-spatial vision-language learning for tunnel defect inspection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "Pillow>=10", "torch==2.10.0", "transformers==5.2.0", "peft==0.20.0"]

[project.optional-dependencies]
data = ["datasets==4.8.4", "pyarrow>=18", "huggingface-hub>=1.4,<2"]
test = ["pytest>=8"]

[project.scripts]
tunnelweave = "tunnelweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
